<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 확인 (390x844)</title>
<style>
  html, body { margin: 0; background: #f5f6fa; }
  .bar { position: fixed; left: 0; top: 0; display: flex; gap: 6px; padding: 8px; z-index: 5; }
  .bar button { font: 12px/1 -apple-system, "Apple SD Gothic Neo", sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  .phone { position: absolute; left: 765px; top: 0; width: 390px; height: 844px; border: 0; background: #fff; display: block; }
  #readout { font: 12px/1 monospace; padding: 8px; position: fixed; right: 8px; top: 8px; }
</style>
</head>
<body>
<div class="bar">
  <button type="button" data-go="a">A 대시보드</button>
  <button type="button" data-go="b">B +844</button>
  <button type="button" data-go="c">C +1688</button>
  <button type="button" data-go="top">처음</button>
</div>
<div id="readout">scrollY 0</div>
<iframe class="phone" id="phone" src="index.html?v=21#/c/spending" title="모바일 미리보기"></iframe>
<script>
  var f = document.getElementById("phone");
  var out = document.getElementById("readout");
  function ready() {
    try { return f.contentDocument && f.contentDocument.querySelector(".dash"); } catch (e) { return null; }
  }
  function scrollTo(y) {
    f.contentWindow.scrollTo(0, Math.round(y));
    out.textContent = "scrollY " + Math.round(f.contentWindow.scrollY);
  }
  function positions() {
    var doc = f.contentDocument;
    var top = function (sel) {
      var el = doc.querySelector(sel);
      return el ? el.getBoundingClientRect().top + f.contentWindow.scrollY : null;
    };
    var a = top(".dash") - 30;
    return { a: a, b: a + 844, c: a + 1688 };
  }
  document.querySelector(".bar").addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (!b) return;
    if (!ready()) { out.textContent = "PIN 입력 후 다시 누르세요"; return; }
    var k = b.getAttribute("data-go");
    if (k === "top") { scrollTo(0); return; }
    scrollTo(positions()[k]);
  });
  document.addEventListener("keydown", function (e) {
    if (!ready()) return;
    if (e.key === "ArrowDown") { e.preventDefault(); scrollTo(f.contentWindow.scrollY + 700); }
    if (e.key === "ArrowUp") { e.preventDefault(); scrollTo(f.contentWindow.scrollY - 700); }
  });
  f.addEventListener("load", function () {
    setTimeout(function () {
      var d = f.contentDocument;
      // 아이폰처럼 스크롤바가 폭을 잡지 않게 (미리보기 전용)
      var st = d.createElement("style");
      st.textContent = "::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none}.topbar{position:static!important}";
      d.head.appendChild(st);
      var c = d.getElementById("composer");
      if (c) c.style.display = "none";
      var w = d.querySelector(".wrap");
      if (w) w.style.paddingBottom = "16px";
    }, 600);
  });
</script>
</body>
</html>
